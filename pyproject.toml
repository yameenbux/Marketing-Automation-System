[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas"
version = "0.1.0"
description = "YSB marketing automation system: product knowledge, content, creative production, compliant lead research"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
]

[project.optional-dependencies]
tts = ["piper-tts>=1.2"]
dev = ["pytest>=8", "pip-audit>=2.7"]

[project.scripts]
mas = "mas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["media: tests that need ffmpeg/ffprobe"]
